<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages — SwanPass Venue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/sp.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .inbox { display: grid; grid-template-columns: 320px 1fr; min-height: 520px; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
  .threads { border-right: 1px solid var(--line); overflow: auto; }
  .th { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .th:hover, .th.on { background: var(--surface-2); }
  .th .av { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .th b { font-size: 14px; } .th p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th .t { font-size: 11.5px; color: var(--muted); text-align: right; }
  .th .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-top: 6px; }
  .conv { display: flex; flex-direction: column; min-width: 0; }
  .conv-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .msgs { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
  .bub { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
  .bub.in { align-self: flex-start; background: var(--surface-3); border-bottom-left-radius: 4px; }
  .bub.out { align-self: flex-end; background: var(--red); color: #fff; border-bottom-right-radius: 4px; }
  .bub small { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
  .compose { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .quick .chip { flex: none; height: 30px; font-size: 12.5px; }
  .compose .row2 { display: flex; gap: 8px; }
  .compose textarea { flex: 1; min-height: 44px; resize: vertical; padding: 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); }
  @media (max-width: 900px) { .inbox { grid-template-columns: 1fr; } .threads { max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<script src="../assets/data.js"></script>
<script src="../assets/sp.js"></script>
<script src="../assets/app.js"></script>
<script>
appShell({ area: 'shop', active: 'msgs', title: 'Messages', actions: `<span class="muted" style="font-size:13px">Notifications: <b style="color:var(--deal)">LINE ✓</b></span>` });
/* SAMPLE customer messages to the demo owner (Don Quixote). Venue facts used in replies are Don Quixote's real data. */
const THREADS = [
  { who: 'Tom', from: '🇬🇧', topic: 'Available today?', time: '2 min', unread: 1, msgs: [['in', 'Hi! I saw Don Quixote on SwanPass. Are you open this afternoon? Thinking of coming around 4pm.', '14:02']] },
  { who: 'Daniel', from: '🇦🇺', topic: 'The SwanPass deal', time: '25 min', unread: 1, msgs: [['in', 'Is the free jacuzzi deal still on this week?', '13:39']] },
  { who: 'Kenji', from: '🇯🇵', topic: 'Prices', time: '1 h', unread: 1, msgs: [['in', 'How much for 90 minutes?', '13:01']] },
  { who: 'Mark', from: '🇺🇸', topic: 'Book a time', time: 'Yesterday', unread: 0, msgs: [['in', 'Can I book for Saturday 8pm?', 'Yesterday 21:10'], ['out', 'Yes, see you Saturday at 8pm. Ask for the manager at the counter.', 'Yesterday 21:14'], ['in', 'Thanks!', 'Yesterday 21:15']] },
];
let cur = 0;
const QUICK = ['Yes, we’re open 12:00–02:00 today', 'Yes — say “SwanPass” at the counter', '90 min regular room is ฿2,700', 'Sorry, we’re fully booked — try after 9pm'];
function draw() {
  const t = THREADS[cur];
  $('#body').innerHTML = `
    <div class="kpis"><div class="kpi"><span>Messages this month</span><b>48</b><small>↑ from SwanPass visitors</small></div><div class="kpi"><span>Your reply time</span><b>12 min</b><small>Shown on your listing</small></div><div class="kpi"><span>Unanswered</span><b>${THREADS.filter(x => x.unread).length}</b><small class="down">Reply within 1 h to keep your badge</small></div><div class="kpi"><span>Questions</span><b>1</b><small>On your public page</small></div></div>
    <div class="alert" style="margin-bottom:16px">${icon('chat')}<div><b>Every new message is sent to your LINE instantly.</b> Tap “Reply” in LINE to answer here — you don’t need to keep this page open. Customers never see your phone number.</div></div>
    <div class="inbox"><div class="threads">${THREADS.map((x, i) => `<div class="th ${i === cur ? 'on' : ''}" data-th="${i}"><span class="av">${x.from}</span><div style="min-width:0"><b>${x.who}</b> <span class="muted" style="font-size:12px">· ${x.topic}</span><p>${esc(x.msgs[x.msgs.length - 1][1])}</p></div><div class="t">${x.time}${x.unread ? '<br><span class="dot"></span>' : ''}</div></div>`).join('')}</div>
      <div class="conv"><div class="conv-head"><div><b>${t.from} ${t.who}</b> <span class="muted" style="font-size:12.5px">· ${t.topic} · via SwanPass</span></div><button class="btn btn-ghost btn-sm">Mark done</button></div>
        <div class="msgs" id="msgs">${t.msgs.map(([d, m, at]) => `<div class="bub ${d}">${esc(m)}<small>${at}</small></div>`).join('')}</div>
        <div class="compose"><div class="quick">${QUICK.map(q => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="row2"><textarea id="reply" placeholder="Write a reply…"></textarea><button class="btn btn-red" data-send>Send</button></div></div></div></div>
    <section class="fcard" id="questions" style="margin-top:22px"><header><div><h2>Public questions on your page</h2><p>Answers show on your listing for everyone — good answers convert visitors.</p></div></header>
      <div class="alert">${icon('chat')}<div><b>“Do you take credit cards?”</b> — asked by a member 3 h ago<div class="row" style="gap:8px;margin-top:8px"><input class="input" placeholder="Answer publicly…" style="flex:1"><button class="btn btn-red btn-sm">Answer</button></div></div></div></section>`;
}
document.addEventListener('click', e => {
  const th = e.target.closest('[data-th]'); if (th) { cur = +th.dataset.th; THREADS[cur].unread = 0; draw(); return; }
  const q = e.target.closest('[data-q]'); if (q) { $('#reply').value = q.dataset.q; $('#reply').focus(); return; }
  if (e.target.closest('[data-send]')) { const v = $('#reply').value.trim(); if (!v) return; THREADS[cur].msgs.push(['out', v, 'now']); THREADS[cur].unread = 0; draw(); toast('Sent — the customer gets it in their SwanPass inbox and by email'); }
});
draw();
$('.alert').insertAdjacentHTML('beforeend', note('Customers message through SwanPass; the venue is pinged on LINE/WhatsApp with a deep link to reply (no daily log-in needed). Reply time is measured and shown on the listing; fast responders rank slightly higher. SAMPLE conversations; replies use Don Quixote’s real hours/prices.'));
</script>
</body>
</html>
