<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best of 2026 — Editors' Picks | SwanPass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sp.css">
<style>
  .best-hero { padding: 28px 0 18px; text-align: center; background: radial-gradient(600px 220px at 50% 0%, rgba(240, 195, 106, .16), transparent); border-bottom: 1px solid var(--line); }
  .best-hero h1 { font-size: clamp(30px, 4vw, 44px); }
  .best-hero .lede { font-size: 14px; }
  .best-hero .chips { justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .ranked { display: flex; flex-direction: column; gap: 8px; max-width: 860px; margin: 0 auto; }
  .r-item { display: grid; grid-template-columns: 36px 96px 1fr; gap: 14px; align-items: center; padding: 10px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
  .r-item:hover { border-color: var(--line-2); }
  .r-item.top { border-color: rgba(240, 195, 106, .4); background: linear-gradient(110deg, rgba(240, 195, 106, .08), var(--surface) 50%); }
  .r-num { font-weight: 900; font-size: 26px; line-height: 1; color: var(--muted); text-align: center; }
  .r-item.top .r-num { color: var(--gold); }
  .r-item img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; }
  .r-item h2 { font-weight: 700; font-size: 16px; margin: 0 0 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .r-item p { color: var(--text-2); font-size: 13px; margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .r-item .card-deal { font-size: 12.5px; margin-top: 4px; }
  .awards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 860px; margin: 0 auto 18px; }
  .award { padding: 10px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .award img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .award small { color: var(--gold); font-weight: 700; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  @media (max-width: 900px) { .awards { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .r-item { grid-template-columns: 26px 72px 1fr; gap: 10px; padding: 8px; } .r-item img { width: 72px; height: 72px; } .r-num { font-size: 20px; } .r-item p { display: none; } }
</style>
</head>
<body>
<main>
  <section class="best-hero"><div class="wrap">
    <div class="eyebrow">SwanPass editors' picks</div>
    <h1 class="display" style="margin-top:12px">Best of <em id="b-city">Bangkok</em></h1>
    <p class="lede" style="margin:12px auto 0">Hand-picked on service, value and verified reviews. Updated every quarter.</p>
    <div class="chips" id="b-cities"></div>
    <div class="chips" id="b-cats" style="margin-top:10px"></div>
  </div></section>
  <section class="section" style="padding-top:20px"><div class="wrap">
    <div class="awards" id="awards"></div>
    <div class="ranked" id="ranked"></div>
  </div></section>
</main>
<script src="assets/data.js"></script>
<script src="assets/sp.js"></script>
<script>
  shell('best');
  let cat = '';
  const WHY = ['Consistently the highest-rated in the city, with a rare 5-star cleanliness record.', 'Japanese-style rooms with private jacuzzis, and staff who speak English.', 'Best value on the strip — the SwanPass deal makes it cheaper than walking in.', 'The most polished front-of-house we tested; good for first-timers.', 'Late hours and a big, rotating line-up.', 'Small and quiet, with regulars who keep coming back.', 'Large rooms, spotless showers, fair prices.', 'Newcomer that went straight into the top ten on reviews.'];
  function render() {
    const loc = getLoc();
    $('#b-city').textContent = locLabel();
    $('#b-cities').innerHTML = CITIES.filter(c => c.count >= 20).map(c => `<button class="chip ${loc.city === c.slug ? 'on' : ''}" data-bc="${c.slug}">${countryOf(c.country).flag} ${c.name}</button>`).join('') + `<button class="chip" data-open="loc">More cities…</button>`;
    $('#b-cats').innerHTML = `<button class="chip ${!cat ? 'on' : ''}" data-bk="">Best overall</button>` + ['massage', 'soapy', 'go-go', 'gentlemens-clubs', 'ktv'].map(s => `<button class="chip ${cat === s ? 'on' : ''}" data-bk="${s}">Best ${CATEGORIES.find(c => c.slug === s).name.toLowerCase()}</button>`).join('');
    let pool = LISTINGS.filter(l => (!loc.country || l.country === loc.country) && (!loc.city || l.city === loc.city) && (!cat || l.cats.includes(cat)) && l.rating);
    if (pool.length < 3) pool = LISTINGS.filter(l => l.rating && (!cat || l.cats.includes(cat)));
    pool.sort((a, b) => score(b) - score(a));
    const pick = (fn, label) => { const l = LISTINGS.filter(x => x.city === (loc.city || x.city)).find(fn) || pool[0]; return `<a class="award" href="listing.html?v=${l.slug}"><img src="${l.img}" alt=""><div><small>${label}</small><div style="font-weight:600">${esc(l.name)}</div></div></a>`; };
    $('#awards').innerHTML = pick(l => l.featured, 'Best overall') + pick(l => l.deal, 'Best deal') + pick(l => l.isNew, 'Best newcomer') + pick(l => l.priceLevel === 1 && l.rating >= 4.5, 'Best value');
    $('#ranked').innerHTML = pool.slice(0, 10).map((l, i) => `<a class="r-item ${i < 3 ? 'top' : ''}" href="listing.html?v=${l.slug}"><div class="r-num">${i + 1}</div><img src="${l.img}" alt="" loading="lazy"><div>
      <h2>${esc(l.name)} ${l.verified ? tick : ''}</h2>
      <div class="card-meta"><span>${l.cat}</span><span class="dot"></span><span class="rating">${starIcon}${l.rating.toFixed(1)}</span><span>(${l.reviews})</span><span class="dot"></span><span>${l.areaName || l.cityName}</span>${l.priceFrom ? `<span class="dot"></span><span>from ฿${l.priceFrom.toLocaleString()}</span>` : ''}</div>
      <p>${WHY[i % WHY.length]}</p>
      ${l.deal ? `<div class="card-deal" style="padding:0;margin-top:4px">${icon('tag')}${esc(l.deal)}</div>` : ''}
    </div></a>`).join('');
  }
  document.addEventListener('click', e => {
    const c = e.target.closest('[data-bc]'); if (c) { const ci = cityOf(c.dataset.bc); setLoc({ country: ci.country, city: ci.slug }); }
    const k = e.target.closest('[data-bk]'); if (k) { cat = k.dataset.bk; render(); }
  });
  document.addEventListener('sp:loc', render);
  render();
  $('.best-hero .lede').insertAdjacentHTML('beforeend', ' ' + note('City chips now cover every city with 20+ venues (currently Bangkok, Pattaya, Chiang Mai, Phuket only). Category tabs give each “Best soapy in Bangkok” its own URL for SEO.'));
</script>
</body>
</html>
