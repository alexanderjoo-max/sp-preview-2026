<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don Quixote — Sukhumvit, Bangkok | SwanPass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/sp.css">
<style>
  .gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 210px 210px; gap: 8px; border-radius: var(--r-lg); overflow: hidden; margin-top: 8px; position: relative; }
  .gallery button { position: relative; overflow: hidden; background: var(--surface-2); }
  .gallery button:first-child { grid-row: span 2; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
  .gallery button:hover img { transform: scale(1.04); }
  .gal-wrap { position: relative; }
  .gal-wrap .all { position: absolute; right: 14px; bottom: 14px; }
  .gal-tabs { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 6px; }
  .gal-count { display: none; }
  .safe .gallery .g-staff img { filter: blur(22px) saturate(.7); transform: scale(1.15); }
  .safe .gallery .g-staff.revealed img { filter: none; transform: none; }
  .g-reveal { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-2); }
  .safe .gallery .g-staff.revealed .g-reveal, body:not(.safe) .g-reveal { display: none; }
  .pdp { display: grid; grid-template-columns: 1fr 360px; gap: 40px; align-items: start; }
  .pdp-title h1 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.03em; font-size: clamp(30px, 4vw, 44px); line-height: 1.1; margin: 10px 0 12px; display: flex; align-items: center; gap: 12px; }
  .pdp-title h1 .verified-tick { width: 30px; height: 30px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--text-2); font-size: 14.5px; }
  .facts > span { display: inline-flex; align-items: center; gap: 6px; }
  .facts .ico { width: 16px; height: 16px; color: var(--muted); }
  .anchors { position: sticky; top: var(--hdr-total); z-index: 40; background: rgba(11, 9, 14, .92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); margin: 26px 0 0; }
  .anchors .chips { padding: 10px 0; }
  .anchors .chip.on { background: var(--red); border-color: var(--red); color: #fff; }
  .blk { padding: 34px 0; border-bottom: 1px solid var(--line); }
  .blk h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; font-size: 22px; margin: 0 0 16px; }
  .deal-box { padding: 20px; border-radius: var(--r-lg); background: linear-gradient(120deg, rgba(95, 240, 181, .14), rgba(95, 240, 181, .03)); border: 1px solid rgba(95, 240, 181, .3); }
  .deal-box .t { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--deal); line-height: 1.05; }
  .menu-group + .menu-group { margin-top: 22px; }
  .menu-group h3 { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .02em; margin-bottom: 8px; }
  .menu-row { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); font-size: 15.5px; }
  .menu-row .lead { flex: 1; border-bottom: 1px dotted var(--line-2); transform: translateY(-4px); }
  .menu-row b { font-variant-numeric: tabular-nums; }
  .amen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .amen span { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 14.5px; }
  .amen .ico { color: var(--deal); width: 16px; height: 16px; }
  .hours { display: grid; gap: 2px; max-width: 420px; }
  .hours div { display: flex; justify-content: space-between; padding: 9px 12px; border-radius: 8px; font-size: 14.5px; color: var(--text-2); }
  .hours div.today { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .rev-sum { display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: center; margin-bottom: 20px; }
  .rev-sum .big { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; }
  .bar { display: grid; grid-template-columns: 14px 1fr 30px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .bar i { height: 6px; border-radius: 9px; background: var(--surface-3); overflow: hidden; display: block; }
  .bar i b { display: block; height: 100%; background: var(--gold); border-radius: 9px; }
  .review { padding: 16px 0; border-top: 1px solid var(--line); }
  .review .who { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .review .who .av { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: 12px; }
  .review p { margin: 8px 0 6px; color: var(--text-2); }
  .stars { color: var(--gold); letter-spacing: 1px; font-size: 13px; }
  #pdp-map { height: 300px; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); }
  .side { position: sticky; top: calc(var(--hdr-total) + 76px); display: flex; flex-direction: column; gap: 14px; }
  .panel { padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
  .cta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-line-app { background: #06c755; color: #fff; }
  .btn-wa { background: #25d366; color: #0b1a10; }
  .actionbar { display: none; }
  .leaflet-container { background: #111; }
  @media (max-width: 1100px) { .pdp { grid-template-columns: 1fr; } .side { position: static; } .side .contact { display: none; } }
  @media (max-width: 720px) {
    .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 0; margin: 0 calc(var(--gutter) * -1); height: 300px; gap: 0; scrollbar-width: none; }
    .gallery::-webkit-scrollbar { display: none; }
    .gallery button { flex: 0 0 100%; scroll-snap-align: start; }
    .gal-wrap .all { top: 12px; right: 12px; bottom: auto; height: 30px; font-size: 12px; padding: 0 10px; background: rgba(0,0,0,.55); }
    .gal-count { display: block; position: absolute; right: 12px; bottom: 12px; font-size: 12px; font-weight: 700; background: rgba(0,0,0,.6); padding: 4px 9px; border-radius: 8px; }
    .gal-wrap { position: relative; }
    .gal-tabs { bottom: 12px; left: 12px; }
    .gal-tabs .chip { height: 30px; font-size: 12px; }
    .gal-tabs .chip:not(.on) { background: rgba(0,0,0,.55); }
    .pdp { gap: 0; }
    .anchors { margin-top: 18px; }
    .amen { grid-template-columns: 1fr 1fr; }
    .rev-sum { grid-template-columns: 1fr; gap: 12px; }
    .tabbar { display: none; }
    .actionbar { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 52px; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; padding: 10px max(12px, var(--sar)) calc(10px + var(--sab)) max(12px, var(--sal)); background: rgba(11, 9, 14, .95); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
    body { padding-bottom: calc(70px + var(--sab)); }
    .actionbar .btn { height: 46px; padding: 0 8px; font-size: 13.5px; }
  }
  .menu-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .menu-card { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
  .mc-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: linear-gradient(90deg, rgba(232, 20, 42, .22), rgba(232, 20, 42, .04)); border-bottom: 1px solid rgba(232, 20, 42, .25); font-weight: 700; font-size: 14px; }
  .menu-card.alt .mc-head { background: linear-gradient(90deg, rgba(212, 168, 71, .22), rgba(212, 168, 71, .04)); border-bottom-color: rgba(212, 168, 71, .25); }
  .mc-head small { color: var(--muted); font-weight: 500; font-size: 12px; }
  .mc-row { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; font-size: 14px; }
  .mc-row:nth-child(even) { background: rgba(255, 255, 255, .035); }
  .mc-row .dur { color: var(--text-2); }
  .mc-row .pp { font-weight: 800; font-size: 15.5px; font-variant-numeric: tabular-nums; }
  .menu-card.alt .mc-row .pp { color: var(--gold); }
  .pay-box { margin-top: 14px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
  .pay-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .pay-grid div { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .pay-grid span { color: var(--muted); font-size: 12px; }
  .rv-badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); vertical-align: 1px; }
  .rv-badge.trip { color: var(--gold); border-color: rgba(212, 168, 71, .4); }
  .review.trip { border: 1px solid rgba(212, 168, 71, .3); border-radius: 12px; padding: 14px; background: linear-gradient(110deg, rgba(212, 168, 71, .06), transparent 60%); }
  .rv-form label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .rv-form .stars-in button { font-size: 26px; color: var(--gold); }
  .qa-empty { padding: 16px; border-radius: 12px; border: 1px dashed var(--line-2); }
  .qa-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .tagpop { position: absolute; left: 50%; transform: translateX(-50%); font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--deal); background: var(--deal-bg); padding: 2px 7px; border-radius: 4px; }
</style>
</head>
<body>
<main class="wrap" id="pdp"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/sp.js"></script>
<script>
  shell('search');
  const slug = new URLSearchParams(location.search).get('v') || 'don-quixote';
  const L0 = LISTINGS.find(l => l.slug === slug) || LISTINGS[0];
  /* every venue uses Don Quixote's rich detail in the mockup, re-labelled with its own name/photo */
  /* Only REAL data: Don Quixote uses its full live-page detail; every other venue is built from its own live-page facts (REAL).
     Anything without a real source is left empty and its section is hidden — nothing is borrowed from another venue. */
  const IS_DQ = slug === 'don-quixote', R0 = REAL[slug] || {};
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const D = IS_DQ ? DETAIL : {
    name: L0.name, cats: L0.cats.map(c => (CATEGORIES.find(x => x.slug === c) || { name: L0.cat }).name), area: L0.areaName || L0.cityName, city: L0.cityName, country: countryOf(L0.country).name,
    rating: L0.rating || 0, reviewsCount: L0.reviewCount, deal: L0.deal ? { title: L0.deal, detail: 'Say “SwanPass” at the counter or show this page.', expires: 'Ongoing' } : null,
    about: R0.desc || '', amenities: [], menu: R0.menuEx ? [{ group: 'Example prices', items: R0.menuEx.map(([label, price]) => ({ label, price })) }] : [],
    hours: R0.hours ? DAYS.filter(d => R0.hours[d]).map(d => [d, ...R0.hours[d]]) : [],
    phone: R0.tel || '', line: R0.line || '', whatsapp: R0.wa || '', telegram: '', website: '', address: R0.addr || '',
    lat: L0.lat, lng: L0.lng, reviews: [], breakdown: null, faq: R0.faq || [],
  };
  const fromPrice = IS_DQ ? 2100 : L0.priceFrom;
  /* real photo split: Venue = property photos, Staff = talent photos */
  const SETS = { venue: L0.venueImgs, staff: L0.staffImgs };
  const MOSAIC = [['venue', 0], ['venue', 1], ['venue', 2], ['staff', 0], ['staff', 1]].map(([k, i]) => SETS[k][i] ? [k, i] : null).filter(Boolean);
  while (MOSAIC.length < 5 && MOSAIC.length < SETS.venue.length + SETS.staff.length) { const all = [...SETS.venue.map((_, i) => ['venue', i]), ...SETS.staff.map((_, i) => ['staff', i])]; const nx = all.find(([k, i]) => !MOSAIC.some(([k2, i2]) => k2 === k && i2 === i)); MOSAIC.push(nx); }
  document.title = `${D.name} — ${D.area}, ${D.city} | SwanPass`;
  const today = (new Date().getDay() + 6) % 7;
  const dayHours = D.hours.length === 7 ? D.hours[today] : (D.hours.find(h => h[0] === DAYS[today]) || null);
  const fmt = t => { const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm'); };
  const total = D.breakdown ? Object.values(D.breakdown).reduce((a, b) => a + b, 0) : 0;
  const nearby = LISTINGS.filter(l => l.slug !== slug && l.city === L0.city).sort(SORTS.recommended[1]).slice(0, 8);

  $('#pdp').innerHTML = `
    <nav class="crumbs" style="margin-top:18px"><a href="index.html">Home</a><a href="place.html?country=${L0.country}">${D.country}</a><a href="place.html?city=${L0.city}">${D.city}</a>${L0.area ? `<a href="place.html?city=${L0.city}&area=${L0.area}">${D.area}</a>` : ""}<span>${esc(D.name)}</span></nav>
    <div class="gal-wrap">
      <div class="gallery" id="gallery">${MOSAIC.map(([set, i], n) => `<button aria-label="${set === 'staff' ? 'Staff' : 'Venue'} photo ${i + 1}" class="${set === 'staff' ? 'g-staff' : ''}" data-set="${set}" data-i="${i}"><img src="${rs(SETS[set][i], n ? 700 : 1200)}" alt="" ${n ? 'loading="lazy"' : ''}>${set === 'staff' ? `<span class="g-reveal">${icon('eye')}</span>` : ''}</button>`).join('')}
      </div>
      <div class="gal-tabs"><button class="chip on" data-open-gal="venue">Venue · ${SETS.venue.length}</button>${SETS.staff.length ? `<button class="chip" data-open-gal="staff">Staff · ${SETS.staff.length}</button>` : ''}</div>
      <button class="btn btn-ghost btn-sm all" data-open-gal="venue">${icon('grid')} All ${SETS.venue.length + SETS.staff.length} photos</button>
      <span class="gal-count num">1 / ${MOSAIC.length}</span>
    </div>

    <div class="pdp" style="margin-top:22px">
      <div>
        <div class="pdp-title">
          <div class="row" style="flex-wrap:wrap;gap:6px">${D.cats.map(c => `<span class="badge b-ver" style="color:var(--text-2);border-color:var(--line-2);background:var(--surface-2)">${c}</span>`).join('')}<span class="badge b-feat">★ Featured</span><span class="badge b-ver">✓ Verified ${note('Verified = SwanPass has checked the venue in person or by video in the last 6 months. The date is stored (content_verified_at) and shown on hover.')}</span></div>
          <h1 class="notranslate">${esc(D.name)}${tick}</h1>
          <div class="facts">
            ${D.rating ? `<span><span class="rating">${starIcon}${D.rating.toFixed(1)}</span><a href="#reviews" class="muted">(${D.reviewsCount} review${D.reviewsCount === 1 ? '' : 's'})</a></span>` : '<span class="muted">No reviews yet</span>'}${L0.views ? `<span class="muted">👁 ${L0.views} views</span>` : ''}
            <span>${icon('pin')}${D.area}, ${D.city}</span>
            ${dayHours ? (L0.openNow === false ? `<span><span class="open-dot closed"></span><b>Closed</b>&nbsp;· opens ${fmt(dayHours[1])}</span>` : `<span><span class="open-dot"></span><b style="color:var(--deal)">Open now</b>&nbsp;· until ${fmt(dayHours[2])}</span>`) : ''}
            ${fromPrice ? `<span>${icon('tag')}From ${money(fromPrice)}</span>` : ''}
          </div>
          <div class="row me-row" style="gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-checkin>✓ I’ve been here</button><button class="btn btn-ghost btn-sm" data-addlist>${icon('plus')} Add to list</button><button class="btn btn-ghost btn-sm" data-msg>${icon('chat')} Message venue</button></div>
        </div>
      </div>
      <div></div>
    </div>

    <div class="anchors" id="anchors"><div class="chips">${[['overview', 'Overview'], ['deal', 'Deal'], ['prices', 'Prices'], ...(L0.staffCount ? [['staff', 'Staff']] : []), ['reviews', 'Reviews'], ['hours', 'Hours & contact'], ['location', 'Location'], ['hotels', 'Stay nearby'], ['qa', 'Q&A'], ['faq', 'FAQ'], ['nearby', 'Nearby']].filter(([k]) => k !== 'deal' || D.deal).map(([k, t], i) => `<a class="chip ${i ? '' : 'on'}" href="#${k}">${tl(t)}</a>`).join('')}</div></div>

    <div class="pdp">
      <div>
        <section class="blk" id="overview"><h2>${tl('About')}</h2>${D.about ? `<div class="prose"><p>${esc(D.about)}</p></div>` : '<p class="muted">The venue hasn’t added a description yet.</p>'}
          ${D.amenities.length ? '' : '<!--'}<div class="amen" style="margin-top:18px">${D.amenities.map(a => `<span>${icon('check')}${a}</span>`).join('')}</div>${D.amenities.length ? '' : '-->'}
        ${D.deal ? `<section class="blk" id="deal"><h2>${tl('SwanPass deal')}</h2><div class="deal-box"><div class="eyebrow" style="color:var(--deal)">Exclusive · ${D.deal.expires}</div><div class="t" style="margin-top:6px">${esc(D.deal.title)}</div><p class="muted" style="margin:8px 0 14px">${D.deal.detail}</p><div class="row" style="flex-wrap:wrap"><button class="btn btn-red btn-sm">${icon('ticket')} Show at counter</button><a class="btn btn-ghost btn-sm" href="account/index.html#pass">Add to my pass</a></div></div></section>` : ''}
        ${D.menu.length ? `<section class="blk" id="prices"><h2>${tl('Prices')}</h2><div class="menu-cards">${D.menu.map((g, gi) => `<div class="menu-card ${gi ? 'alt' : ''}"><div class="mc-head"><span>${gi ? '🛁' : '💆'} ${g.group}</span><small>${g.items.length} options</small></div>${g.items.map((it, ii) => `<div class="mc-row"><span class="dur">${it.label ? esc(it.label) : '⏱ ' + it.dur + ' min'}</span><span class="pp">฿${it.price.toLocaleString()} <span class="approx" style="font-size:12px">${approx(it.price)}</span></span></div>`).join('')}</div>`).join('')}</div>
          <p class="muted" style="font-size:13px;margin-top:14px">${IS_DQ ? 'Full menu from the venue’s SwanPass listing.' : 'Example prices from the venue’s SwanPass listing.'} Tips not included. ${curSelect()}</p></section>` : ''}
        ${L0.staffCount ? `<section class="blk" id="staff"><div class="row between" style="flex-wrap:wrap;gap:10px;margin-bottom:14px"><h2 style="margin:0">${tl('Staff')} <span class="muted" style="font-size:15px;font-weight:500">· ${L0.staffCount} photos</span></h2>${safeToggle()}</div><div class="staff-grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${L0.staffImgs.map((p, i) => `<button class="staff" data-set="staff" data-i="${i}"><img src="${rs(p, 400)}" alt="" loading="lazy"><span class="reveal">${icon('eye')}</span></button>`).join('')}</div></section>` : ''}
        <section class="blk" id="reviews"><h2>${tl('Reviews')}</h2>
          <div class="rev-sum"><div><div class="big">${D.rating || '–'}</div><div class="stars">★★★★☆</div><div class="muted" style="font-size:13px">${D.reviewsCount} reviews</div></div>
            <div style="display:grid;gap:6px">${!D.breakdown ? '' : [5, 4, 3, 2, 1].map(n => `<div class="bar"><span>${n}</span><i><b style="width:${(D.breakdown[n] / total * 100).toFixed(0)}%"></b></i><span class="num">${D.breakdown[n]}</span></div>`).join('')}</div></div>
          <div class="row" style="margin-bottom:6px;flex-wrap:wrap"><button class="chip on">Most helpful</button><button class="chip">Newest</button><button class="chip">English</button><button class="chip">한국어</button><span style="flex:1"></span><button class="btn btn-red btn-sm" data-review>${icon('edit')} Review your visit</button></div>
          ${D.reviews.map(r => `<div class="review ${r.trip ? 'trip' : ''}"><div class="who"><span class="av">${r.who.slice(0, 2)}</span><span>${r.flag || ''} ${r.who}${r.visits ? ` <span class="rv-badge">${r.visits}</span>` : ''}${r.trip ? ' <span class="rv-badge trip">📝 Trip report</span>' : ''}<div class="muted" style="font-size:12px;font-weight:500">${r.when}${r.paid ? ` · paid ${money(r.paid)}` : ''}</div></span><span class="stars" style="margin-left:auto">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span></div>${r.title ? `<b style="display:block;margin-top:8px">${esc(r.title)}</b>` : ''}<p>${esc(r.translated || r.text)}</p>${r.translated ? `<div class="muted" style="font-size:12.5px">Translated from Korean · <a href="#" style="text-decoration:underline">Show original</a></div>` : ''}<div class="muted" style="font-size:12.5px;margin-top:4px">Helpful (${r.helpful}) · Report</div></div>`).join('')}
          ${D.reviews.length ? `<button class="btn btn-ghost" style="margin-top:12px">Show all ${D.reviewsCount} reviews</button>` : `<p class="muted">Review text isn’t loaded in this mockup — <a href="https://swanpass.com/listing/${slug}" target="_blank" rel="noopener" style="text-decoration:underline">read them on swanpass.com</a>.</p>`}</section>
        <section class="blk" id="qa"><div class="row between" style="flex-wrap:wrap;gap:10px;margin-bottom:12px"><h2 style="margin:0">${tl('Questions & answers')}</h2><button class="btn btn-ghost btn-sm" data-ask>${icon('chat')} Ask a question</button></div>
          <div id="qa-list"><div class="qa-empty"><b>No questions yet.</b><p class="muted" style="margin:4px 0 0">Ask about prices, opening hours or what to expect — the venue and members who’ve been here can answer. Answers are public.</p></div></div></section>
        <section class="blk" id="hours"><h2>${tl('Hours & contact')}</h2>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px">
            <div class="hours">${!D.hours.length ? '<p class="muted">Hours not listed — call to check.</p>' : D.hours.map(([d, o, c], i) => `<div class="${i === today ? 'today' : ''}"><span>${d}${i === today ? ' · today' : ''}</span><span class="num">${fmt(o)} – ${fmt(c)}${+c.split(':')[0] < +o.split(':')[0] ? ' <span class="muted">(next day)</span>' : ''}</span></div>`).join('')}</div>
            <div class="stack"><a class="btn btn-ghost btn-block" href="#" data-contact="phone" data-value="${D.phone}" data-venue="${esc(D.name)}" style="justify-content:flex-start">${icon('phone')} ${D.phone}</a><a class="btn btn-ghost btn-block" href="#" data-contact="sms" data-value="${D.phone}" data-venue="${esc(D.name)}" style="justify-content:flex-start">${icon('chat')} Text message</a><a class="btn btn-ghost btn-block" href="#" data-contact="line" data-value="${D.line}" data-venue="${esc(D.name)}" target="_blank" style="justify-content:flex-start">${icon('chat')} LINE: ${D.line}</a><a class="btn btn-ghost btn-block" href="#" data-contact="whatsapp" data-value="${D.whatsapp}" data-venue="${esc(D.name)}" target="_blank" style="justify-content:flex-start">${icon('chat')} WhatsApp</a><a class="btn btn-ghost btn-block" href="#" style="justify-content:flex-start">${icon('globe')} ${D.website}</a></div>
          </div></section>
        <section class="blk" id="location"><h2>${tl('Location')}</h2><p class="muted" style="margin:-6px 0 14px">${D.address}</p><div id="pdp-map"></div>
          <div class="row" style="margin-top:12px;flex-wrap:wrap"><a class="btn btn-ghost btn-sm" href="https://www.google.com/maps/dir//${D.lat},${D.lng}" target="_blank" rel="noopener">${icon('route')} Directions</a><button class="btn btn-ghost btn-sm">${icon('copy')} Copy address</button><span class="muted" style="font-size:13px">5 min walk from BTS Phrom Phong</span></div></section>
        <section class="blk" id="hotels"><h2>${tl('Stay nearby')}</h2><p class="muted" style="margin:-6px 0 14px">Guest-friendly hotels near ${esc(D.area)} — no joiner fee unless marked.</p>
          <div class="hotel-list">${HOTELS.filter(h => h.city === (L0.city in AREAS ? L0.city : 'bangkok')).sort((a, b) => (a.area === L0.area ? -1 : 0) - (b.area === L0.area ? -1 : 0) || ({ yes: 0, fee: 1, no: 2 }[a.guest] - { yes: 0, fee: 1, no: 2 }[b.guest])).slice(0, 3).map(hotelRow).join('')}</div>
          <a class="link-arrow" style="display:inline-block;margin-top:12px" href="hotels.html">All guest-friendly hotels</a></section>
        ${IS_DQ ? `<section class="blk faq" id="faq"><h2>${tl('Questions people ask')}</h2>
          <details open><summary>How much does ${esc(D.name)} cost?</summary><p>The menu runs ฿2,100–฿2,800 for 45 to 90 minutes. Large rooms with a jacuzzi start at ฿2,500.</p></details>
          <details><summary>Is ${esc(D.name)} open now?</summary><p>Today it’s open ${fmt(dayHours[1])}–${fmt(dayHours[2])}. Fridays and Saturdays it stays open until 3am.</p></details>
          <details><summary>How do I get the SwanPass deal?</summary><p>Say “SwanPass” at the counter or show this page. No code or sign-up needed.</p></details>
          <details><summary>Which venues are close by?</summary><p>${nearby.slice(0, 3).map(n => n.name).join(', ')} are all within a few minutes’ walk.</p></details>
        </section>` : D.faq.length ? `<section class="blk faq" id="faq"><h2>${tl('Questions people ask')}</h2>${D.faq.map(([q, an], i) => `<details ${i ? '' : 'open'}><summary>${esc(q)}</summary><p>${esc(an)}</p></details>`).join('')}</section>` : ''}
      </div>
      <aside class="side">
        <div class="panel contact">
          ${D.deal ? `<div class="deal-box" style="padding:14px;margin-bottom:14px"><div class="eyebrow" style="color:var(--deal);font-size:10.5px">SwanPass deal</div><div style="font-weight:700;color:var(--deal);font-size:18px;margin-top:2px">${esc(D.deal.title)}</div></div>` : ''}
          <div class="muted" style="font-size:12px;margin-bottom:8px">Opens the app with a message ready to send ${note('Pre-filled: “Hi! I saw Don Quixote on SwanPass.com and would like to ask a question.” WhatsApp, SMS and LINE official accounts (@id) support pre-fill. For LINE personal IDs, Telegram, WeChat, Zalo and Kakao the chat opens and the message is copied to the clipboard. Bonus: venues see that customers came from SwanPass.')}</div><button class="btn btn-red btn-block" data-msg style="margin-bottom:8px">${icon('chat')} Message on SwanPass</button><div class="cta-grid"><a class="btn btn-ghost" href="#" data-contact="phone" data-value="${D.phone}" data-venue="${esc(D.name)}">${icon('phone')} Call</a><a class="btn btn-line-app" href="#" data-contact="line" data-value="${D.line}" data-venue="${esc(D.name)}" target="_blank">${icon('chat')} LINE</a><a class="btn btn-wa" href="#" data-contact="whatsapp" data-value="${D.whatsapp}" data-venue="${esc(D.name)}" target="_blank">${icon('chat')} WhatsApp</a><a class="btn btn-ghost" href="#" data-contact="telegram" data-value="${D.telegram}" data-venue="${esc(D.name)}" target="_blank">${icon('share')} Telegram</a><a class="btn btn-ghost" href="#location">${icon('route')} Directions</a><button class="btn btn-ghost" data-save="${slug}">${icon('heart')} Save</button></div>
          <div class="row between" style="margin-top:14px;font-size:13px"><span></span><button class="muted">${icon('share')} Share</button></div>
        </div>
        <div class="panel"><b>Is this your venue?</b><p class="muted" style="font-size:13.5px;margin:6px 0 12px">Claim it to update photos, prices and hours yourself.</p><a class="btn btn-ghost btn-sm btn-block" href="shop/index.html">Claim this listing</a></div>
        <div class="panel" style="font-size:13px"><a class="muted" href="#">Report outdated info</a></div>
      </aside>
    </div>

    <section class="section" id="nearby"><div class="sec-head"><div><h2 class="display">Nearby in ${D.area}</h2></div><a class="link-arrow" href="place.html?city=${L0.city}${L0.area ? "&area=" + L0.area : ""}">All of ${D.area}</a></div><div class="scroller">${nearby.map(card).join('')}</div></section>

    <div class="actionbar">${note('Mobile: a fixed contact bar replaces the tab bar on venue pages — Call, LINE and Directions are always one tap away.')}<a class="btn btn-red" href="#" data-contact="phone" data-value="${D.phone}" data-venue="${esc(D.name)}">${icon('phone')} Call</a><a class="btn btn-line-app" href="#" data-contact="line" data-value="${D.line}" data-venue="${esc(D.name)}" target="_blank">LINE</a><a class="btn btn-wa" href="#" data-contact="whatsapp" data-value="${D.whatsapp}" data-venue="${esc(D.name)}" target="_blank">WhatsApp</a><a class="btn btn-ghost" href="#location">${icon('route')} Go</a><button class="btn btn-ghost" data-save="${slug}" aria-label="Save">${icon('heart')}</button></div>`;
  $('.actionbar .note').style.cssText = 'position:absolute;top:-30px;left:12px';

  /* "Review your visit" — 30-second structured review; long text optional (becomes a Trip report when 300+ chars) */
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-review]')) return;
    openModal('rv', `<div class="modal-head"><h3 style="flex:1">Review your visit to ${esc(D.name)}</h3><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div>
      <div class="modal-body rv-form">
        <label>How was it?</label><div class="stars-in">${'<button>★</button>'.repeat(5)}</div>
        <label>What did you pay? <span class="muted" style="font-weight:500">(helps the next visitor)</span></label><div class="row" style="gap:8px"><input class="input" placeholder="฿2,400" style="max-width:140px"><span class="muted" style="font-size:13px">incl. tip?</span><div class="seg"><button class="on">No</button><button>Yes</button></div></div>
        <label>Was it…</label><div class="chips" style="flex-wrap:wrap">${GOOD_TAGS.map(([k, e, t]) => `<button class="chip">${e} ${t}</button>`).join('')}<button class="chip">⚠️ Charged extra</button></div>
        <label>Your visit</label><div class="row" style="gap:8px;flex-wrap:wrap"><div class="seg"><button class="on">First visit</button><button>Been before</button><button>Regular</button></div><select class="select"><option>🇬🇧 UK</option><option>🇺🇸 USA</option><option>🇦🇺 Australia</option><option>🇩🇪 Germany</option><option>🇨🇦 Canada</option><option>Other / hide</option></select></div>
        <label>Tell the story <span class="muted" style="font-weight:500">(optional — 300+ characters becomes a Trip report)</span></label><textarea class="input" rows="4" style="width:100%;height:auto;padding:10px" placeholder="When you went, what you chose, how it went…"></textarea>
      </div>
      <div class="sheet-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-red" style="flex:1" data-close>Post review</button></div>`);
  });

  /* remove contact buttons the venue doesn't have; hide the map when there's no real pin */
  $$('[data-contact]').forEach(a => { if (!a.dataset.value) a.remove(); });
  $$('.stack a.btn').forEach(a => { if (a.textContent.trim() === '' || /globe/.test(a.innerHTML) && !D.website) a.remove(); });
  if (!IS_DQ && !L0.geoReal) { const m = $('#pdp-map'); if (m) m.outerHTML = '<p class="muted">Exact location not listed.</p>'; }

  /* Message venue: sent through SwanPass, forwarded to the venue's LINE/WhatsApp instantly; venue replies from the link or the portal inbox */
  document.addEventListener('click', e => {
    if (e.target.closest('[data-msg]')) {
      const m = openModal('msg', `<div class="modal-head"><h3 style="flex:1">Message ${esc(D.name)}</h3><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div>
        <div class="modal-body rv-form"><label style="margin-top:0">About</label><div class="chips" style="flex-wrap:wrap">${['Available today?', 'Prices', 'Book a time', 'The SwanPass deal', 'Something else'].map((t, i) => `<button class="chip ${i ? '' : 'on'}" data-topic>${t}</button>`).join('')}</div>
        <label>Message</label><textarea class="input" rows="4" style="width:100%;height:auto;padding:10px" placeholder="Hi! I saw ${esc(D.name)} on SwanPass…"></textarea>
        <p class="muted" style="font-size:13px;margin:10px 0 0">Replies arrive in your SwanPass inbox, and we email you when one comes in.</p>
        <p class="muted" style="font-size:12.5px;margin:12px 0 0">The venue is notified by email and replies here. Your phone number isn’t shared.</p></div>
        <div class="sheet-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-red" style="flex:1" data-sendmsg>Send message</button></div>`);
      m.onclick = ev => { const t = ev.target.closest('[data-topic]'); if (t) { $$('[data-topic]', m).forEach(x => x.classList.toggle('on', x === t)); } if (ev.target.closest('[data-sendmsg]')) { closeAll(); const tt = $('#toast'); tt.textContent = `Sent — ${D.name} has been notified. Replies appear in your SwanPass inbox.`; tt.classList.add('show'); setTimeout(() => tt.classList.remove('show'), 3000); } };
    }
    if (e.target.closest('[data-ask]')) {
      const m = openModal('ask', `<div class="modal-head"><h3 style="flex:1">Ask a question</h3><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div>
        <div class="modal-body rv-form"><label style="margin-top:0">Your question about ${esc(D.name)}</label><textarea class="input" rows="3" style="width:100%;height:auto;padding:10px" placeholder="e.g. Do they take cards? Is it busy on Friday nights?"></textarea>
        <p class="muted" style="font-size:12.5px;margin:10px 0 0">Public. The venue and members who checked in here get notified. No phone numbers, prices for “extras” or personal info — those are removed.</p></div>
        <div class="sheet-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-red" style="flex:1" data-postq>Post question</button></div>`);
      m.onclick = ev => { if (ev.target.closest('[data-postq]')) { const q = $('textarea', m).value.trim() || 'Do they take cards?'; closeAll(); $('#qa-list').innerHTML = `<div class="qa-item"><div class="q"><b>Q.</b> ${esc(q)}</div><div class="muted" style="font-size:12.5px;margin-top:4px">You · just now · <span style="color:var(--gold)">waiting for an answer — the venue has been notified</span></div></div>`; } };
    }
  });

  /* member actions: self-reported check-in (levels/badges) + add to a list */
  document.addEventListener('click', e => {
    if (e.target.closest('[data-checkin]')) {
      const r = checkIn(slug), b = e.target.closest('[data-checkin]');
      if (!r) { b.textContent = '✓ Checked in today'; return; }
      b.textContent = '✓ Checked in'; b.classList.add('on');
      const lv = levelFor(r.n), nx = LEVELS.find(x => x[0] > r.n);
      openModal('ci', `<div class="modal-head"><h3 style="flex:1">${r.levelUp ? 'Level up!' : 'Checked in'}</h3><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div>
        <div class="modal-body" style="text-align:center"><div style="font-size:64px;line-height:1">${lv[1]}</div>
        <h2 style="margin:10px 0 4px">${r.levelUp ? `You’re now a ${lv[2]}!` : `${r.n} check-ins`}</h2>
        <p class="muted" style="margin:0">${nx ? `${nx[0] - r.n} more to become ${nx[1]} ${nx[2]}` : 'You’re at the top. Respect.'}</p>
        <p style="margin:18px 0 0"><a class="btn btn-red" href="#reviews" data-close>How was ${esc(D.name)}? Write a review</a></p>
        <p class="muted" style="font-size:12px;margin:12px 0 0">Only you can see your check-ins. Share your location next time for a 📍 on-site check-in.</p></div>`);
    }
    if (e.target.closest('[data-addlist]')) {
      const L = memberLists();
      openModal('al', `<div class="modal-head"><h3 style="flex:1">Add to a list</h3><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div>
        <div class="modal-body">${L.map(l => `<label class="fcheck" style="padding:10px 0"><input type="checkbox" ${l.items.some(i => i.slug === slug) ? 'checked' : ''}><b>${esc(l.name)}</b><span class="n">${l.items.length}</span></label>`).join('')}
        <div class="row" style="gap:8px;margin-top:12px"><input class="input" placeholder="New list name…" style="flex:1"><button class="btn btn-ghost btn-sm">Create</button></div>
        <label style="display:block;margin-top:14px;font-size:13px;font-weight:600">Private note</label><input class="input" placeholder="e.g. ask for Mint, go before 6pm" style="width:100%;margin-top:6px"></div>
        <div class="sheet-foot"><button class="btn btn-red" style="flex:1" data-close>Done</button></div>`);
    }
  });

  /* scroll-spy for the anchor chips */
  const links = $$('#anchors a');
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  $$('.blk, #nearby').forEach(s => io.observe(s));
  $('#gallery').addEventListener('scroll', e => { const i = Math.round(e.target.scrollLeft / e.target.clientWidth) + 1; $('.gal-count').textContent = `${i} / ${MOSAIC.length}`; });
  /* tap a photo: blurred staff photos reveal first, then open the full gallery at that photo */
  document.addEventListener('click', e => {
    const og = e.target.closest('[data-open-gal]'); if (og) { openGallery(SETS, og.dataset.openGal); return; }
    const s = e.target.closest('.staff, .gallery button'); if (!s) return;
    e.preventDefault();
    if ((s.classList.contains('staff') || s.classList.contains('g-staff')) && document.body.classList.contains('safe') && !s.classList.contains('revealed')) { s.classList.add('revealed'); return; }
    openGallery(SETS, s.dataset.set || 'staff', +(s.dataset.i || 0));
  });

  if (window.L && $('#pdp-map')) {
    const map = L.map('pdp-map', { scrollWheelZoom: false, zoomControl: false }).setView([D.lat, D.lng], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    L.marker([D.lat, D.lng], { icon: L.divIcon({ className: '', html: `<div style="width:46px;height:46px;border-radius:50%;border:3px solid var(--red);overflow:hidden;box-shadow:0 0 0 6px rgba(255,59,82,.25)"><img src="${L0.img}" style="width:100%;height:100%;object-fit:cover"></div>`, iconSize: [46, 46], iconAnchor: [23, 23] }) }).addTo(map);
  }
</script>
<div class="toast" id="toast"></div>
</body>
</html>
