<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My SwanPass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/sp.css">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .acct { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; padding-top: 28px; padding-bottom: 60px; }
  .pass { position: relative; border-radius: 18px; padding: 20px; overflow: hidden; isolation: isolate; background: linear-gradient(135deg, #1d0508, #0a0a0a 55%), #0a0a0a; border: 1px solid rgba(232, 20, 42, .35); box-shadow: 0 30px 60px -30px rgba(232, 20, 42, .5); }
  .pass::before { content: ''; position: absolute; inset: -40% -20% auto auto; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(232, 20, 42, .45), transparent 70%); z-index: -1; }
  .pass .tier { font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .side-card { padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); margin-top: 14px; }
  .lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .listcard { border-radius: var(--r-lg); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
  .listcard .mosaic { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; height: 130px; }
  .listcard .mosaic img { width: 100%; height: 100%; object-fit: cover; }
  .listcard .mosaic img:first-child { grid-row: span 2; }
  .listcard div.b { padding: 12px 14px; }
  .acct > section, .acct > aside { min-width: 0; }
  .pane { display: none; } .pane.on { display: block; }
  .pref { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .pref p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .lvl { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .lvl .ic { font-size: 34px; line-height: 1; }
  .lvl b { font-size: 18px; }
  .meter2 { height: 8px; border-radius: 8px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 10px; }
  .meter2 i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .badge2 { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
  .badge2 .ic { font-size: 34px; }
  .badge2 b { display: block; margin-top: 6px; }
  .badge2 small { color: var(--muted); font-size: 12px; }
  .badge2.locked { opacity: .4; filter: grayscale(1); }
  .badge2.got { border-color: rgba(212, 168, 71, .5); background: linear-gradient(160deg, rgba(212, 168, 71, .12), var(--surface) 60%); }
  .ci-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ci-row img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
  .ldetail .note { color: var(--text); width: 100%; margin-top: 6px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); padding: 0 10px; font-size: 13px; }
  .ldetail .lrow { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ldetail .lrow img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; }
  @media (max-width: 900px) { .acct { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="wrap acct">
  <aside>
    <div class="pass" id="pass"></div>
    <div class="side-card"><div class="row"><span class="avatar">AJ</span><div><b>Alexander Joo</b><div class="muted" style="font-size:12.5px" id="me-sum"></div></div></div></div>
    <nav class="side-card" style="padding:8px" id="acct-nav">
      ${''}
    </nav>
  </aside>
  <section>
    <div class="pane on" id="p-overview"></div>
    <div class="pane" id="p-lists"></div>
    <div class="pane" id="p-checkins"></div>
    <div class="pane" id="p-messages"></div>
    <div class="pane" id="p-reviews"></div>
    <div class="pane" id="p-alerts"></div>
    <div class="pane" id="p-prefs"></div>
  </section>
</main>
<script src="../assets/data.js"></script>
<script src="../assets/sp.js"></script>
<script src="../assets/app.js"></script>
<script>
shell('account', { gate: false });
/* Demo member "Alex" — sample account data (lists, check-ins). Venue details on the cards are real. */
const TABS = [['overview', 'Overview', 'home'], ['lists', 'My lists', 'heart'], ['checkins', 'Check-ins & badges', 'star'], ['messages', 'Messages', 'chat'], ['reviews', 'My reviews', 'edit'], ['alerts', 'Alerts', 'bell'], ['prefs', 'Preferences', 'settings']];
$('#acct-nav').innerHTML = TABS.map(([k, t, i]) => `<a class="side-link" href="#${k}" data-tab="${k}">${icon(i)}${t}</a>`).join('') + `<a class="side-link" href="#">${icon('close')}Log out</a>`;
const V = slug => LISTINGS.find(l => l.slug === slug);
const CHECKINS = checkins();
const n = CHECKINS.length, lv = levelFor(n), next = LEVELS.find(x => x[0] > n);
const LISTS = memberLists();

$('#pass').innerHTML = `<div class="row between"><span class="tier">SwanPass member</span><img src="https://swanpass.com/swanpass_logo_rev.png" alt="" style="height:18px"></div>
  <div style="font-size:22px;font-weight:800;margin:14px 0 2px">Alexander J.</div><div class="muted" style="font-size:12.5px">Member since 2023</div>
  <div class="lvl"><span class="ic">${lv[1]}</span><div><b>${lv[2]}</b><div class="muted" style="font-size:12.5px">${n} check-in${n === 1 ? '' : 's'}${next ? ` · ${next[0] - n} more to ${next[2]} ${next[1]}` : ' · top level!'}</div></div></div>
  ${next ? `<div class="meter2"><i style="width:${Math.round((n - lv[0]) / (next[0] - lv[0]) * 100)}%"></i></div>` : ''}`;

$('#p-overview').innerHTML = `
  <h1 class="display" style="font-size:34px;margin-bottom:6px">Welcome back, Alex</h1><p class="muted" style="margin:0 0 22px">What changed at places you follow.</p>
  <div class="kpis"><div class="kpi"><span>Lists</span><b>${LISTS.length}</b><small>${LISTS.reduce((a, l) => a + l.items.length, 0)} venues saved</small></div><div class="kpi"><span>Check-ins</span><b>${n}</b><small>${lv[1]} ${lv[2]}</small></div><div class="kpi"><span>Reviews written</span><b>4</b></div><div class="kpi"><span>Badges</span><b>${BADGES.filter(b => b.test(CHECKINS)).length}</b><small>of ${BADGES.length}</small></div></div>
  <div class="sec-head" style="margin-top:28px"><div><h2 class="display">Deals at places you saved</h2></div></div>
  <div class="grid-cards">${LISTS.flatMap(l => l.items.map(i => V(i.slug))).filter(l => l && l.deal).filter((l, i, a) => a.indexOf(l) === i).slice(0, 3).map(l => card(l)).join('')}</div>
  <div class="alert" style="margin-top:22px">${icon('star')}<div><b>You checked in at ${esc(V(CHECKINS[0].slug).name)} on ${CHECKINS[0].date}.</b> How was it? <a href="../listing.html?v=${CHECKINS[0].slug}#reviews" style="text-decoration:underline">Write a review</a></div></div>`;

function drawLists(open) {
  const L = LISTS.find(l => l.id === open);
  $('#p-lists').innerHTML = !L ? `<div class="sec-head"><div><h2 class="display">My lists</h2><p>Plan a night out, keep a shortlist, share a list with a friend.</p></div><button class="btn btn-red btn-sm">${icon('plus')} New list</button></div>
    <div class="lists">${LISTS.map(l => { const vs = l.items.map(i => V(i.slug)).filter(Boolean); return `<a class="listcard" href="#lists" data-list="${l.id}"><div class="mosaic">${vs.slice(0, 3).map(v => `<img src="${v.img}" alt="">`).join('')}</div><div class="b"><b>${esc(l.name)}</b><div class="muted" style="font-size:12.5px">${vs.length} venues · ${l.shared ? '🔗 Shared' : '🔒 Private'}</div></div></a>`; }).join('')}</div>`
  : `<div class="ldetail"><a href="#lists" data-list="" class="muted" style="font-size:13px">← All lists</a>
    <div class="sec-head" style="margin-top:8px"><div><h2 class="display">${esc(L.name)}</h2><p>${L.items.length} venues · ${L.shared ? '🔗 Anyone with the link can view' : '🔒 Only you'}</p></div><div class="row" style="gap:8px"><a class="btn btn-ghost btn-sm" href="../map.html">${icon('map')} Map</a><button class="btn btn-ghost btn-sm" data-share="${L.id}">${icon('share')} ${L.shared ? 'Copy link' : 'Share'}</button></div></div>
    ${L.items.map(i => { const v = V(i.slug); return v ? `<div class="lrow"><img src="${v.img}" alt=""><div style="min-width:0"><a href="../listing.html?v=${v.slug}"><b>${esc(v.name)}</b></a><div class="muted" style="font-size:12.5px">${esc(v.cat)} · ${esc(v.areaName || v.cityName)}${CHECKINS.some(c => c.slug === v.slug) ? ' · <span style="color:var(--deal)">✓ been here</span>' : ''}</div><input class="note" value="${esc(i.note || '')}" placeholder="Add a private note…"></div><button class="icon-btn" aria-label="Remove">${icon('close')}</button></div>` : ''; }).join('')}</div>`;
}
document.addEventListener('click', e => {
  const l = e.target.closest('[data-list]'); if (l) { e.preventDefault(); drawLists(l.dataset.list); }
  const sh = e.target.closest('[data-share]'); if (sh) { const t = document.getElementById('toast') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'toast', className: 'toast' })); t.textContent = 'Share link copied — swanpass.com/l/7Hq2x'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
});
drawLists();

$('#p-checkins').innerHTML = `<div class="sec-head"><div><h2 class="display">Check-ins & badges</h2><p>Tap “I’ve been here” on a venue page. Your history is private.</p></div></div>
  <div class="fcard" style="padding:18px;margin-bottom:22px"><div class="lvl" style="margin:0"><span class="ic">${lv[1]}</span><div style="flex:1"><b>${lv[2]}</b><div class="muted" style="font-size:13px">${n} check-ins${next ? ` — ${next[0] - n} more to become <b style="color:var(--text)">${next[1]} ${next[2]}</b>` : ''}</div>${next ? `<div class="meter2"><i style="width:${Math.round((n - lv[0]) / (next[0] - lv[0]) * 100)}%"></i></div>` : ''}</div></div>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:14px">${LEVELS.map(x => `<span class="chip ${n >= x[0] ? 'on' : ''}" style="height:30px;font-size:12px">${x[1]} ${x[2]} · ${x[0]}</span>`).join('')}</div></div>
  <h3 style="margin:0 0 10px">Badges</h3>
  <div class="badges" style="margin-bottom:26px">${BADGES.map(b => `<div class="badge2 ${b.test(CHECKINS) ? 'got' : 'locked'}"><div class="ic">${b.icon}</div><b>${b.name}</b><small>${b.how}</small></div>`).join('')}</div>
  <h3 style="margin:0 0 6px">History</h3>
  ${CHECKINS.map(c => { const v = V(c.slug); return v ? `<div class="ci-row"><img src="${v.img}" alt=""><div><a href="../listing.html?v=${v.slug}"><b>${esc(v.name)}</b></a><div class="muted" style="font-size:12.5px">${esc(v.cat)} · ${esc(v.areaName || v.cityName)}${c.near ? ' · <span style="color:var(--deal)">📍 checked in on site</span>' : ''}</div></div><span class="muted" style="font-size:12.5px">${c.date}</span></div>` : ''; }).join('')}`;

$('#p-messages').innerHTML = `<div class="sec-head"><div><h2 class="display">Messages</h2><p>Your conversations with venues. Replies also arrive by email — your phone number is never shared.</p></div></div>
  <div class="fcard" style="padding:0;overflow:hidden">${[['don-quixote', 'Can I book for Saturday 8pm?', 'Yes, see you Saturday at 8pm. Ask for the manager at the counter.', 'Yesterday'], ['jelly-pop-bangkok', 'Is the free jacuzzi deal still on this week?', '', '25 min ago']].map(([sl, q, a, t]) => { const v = LISTINGS.find(l => l.slug === sl); return `<div style="display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)"><img src="${v.img}" alt="" style="width:56px;height:56px;border-radius:10px;object-fit:cover"><div style="min-width:0"><b>${esc(v.name)}</b><div class="muted" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a ? esc(v.name) + ': ' + esc(a) : 'You: ' + esc(q)}</div></div><span class="muted" style="font-size:12px;text-align:right">${t}${a ? '' : '<br><span style="color:var(--gold)">Waiting</span>'}</span></div>`; }).join('')}</div>
  <p class="muted" style="font-size:12.5px;margin-top:10px">Sample conversations. Message any venue from its page with “Message on SwanPass”.</p>`;
$('#p-reviews').innerHTML = `<div class="sec-head"><div><h2 class="display">My reviews</h2><p>After you check in, we’ll ask how it was.</p></div></div>
  <div class="alert">${icon('star')}<div><b>You checked in at ${esc(V(CHECKINS[0].slug).name)} on ${CHECKINS[0].date}.</b> How was it? <a href="../listing.html?v=${CHECKINS[0].slug}#reviews" style="text-decoration:underline">Write a review</a></div></div>
  <p class="muted">Your 4 published reviews appear here.</p>`;
$('#p-alerts').innerHTML = `<div class="sec-head"><div><h2 class="display">Alerts</h2><p>We’ll message you — by email or LINE — when something you follow changes.</p></div></div>
  ${[['A venue on your lists posts a new deal', 'Instantly · LINE', 1], ['New venues in Bangkok', 'Weekly digest · email', 1], ['New venues in Phrom Phong & Asok', 'Weekly · email', 1], ['A venue on your lists closes or moves', 'Instantly · email', 1], ['SwanPass launches in a new country', 'Once · email', 0]].map(([t, d, on]) => `<div class="pref"><div><b>${t}</b><p>${d}</p></div><input type="checkbox" class="switch" ${on ? 'checked' : ''}></div>`).join('')}`;
$('#p-prefs').innerHTML = `<div class="sec-head"><div><h2 class="display">Preferences</h2></div></div>
  <div class="pref"><div><b>Home city</b><p>Pages open on this city first.</p></div><select class="select" id="pref-home">${CITIES.filter(c => c.count >= 5).map(c => `<option value="${c.slug}" ${c.slug === getHome() ? 'selected' : ''}>${countryOf(c.country).flag} ${c.name}</option>`).join('')}</select></div>
  <div class="pref"><div><b>Language</b><p>The whole site, including venue descriptions, is shown in this language.</p></div><select class="select" id="pref-lang">${LANGS.map(([k, f, n]) => `<option value="${k}" ${k === getLang() ? 'selected' : ''}>${f} ${n}</option>`).join('')}</select></div>
  <div class="pref"><div><b>Currency</b><p>Prices are shown in the venue’s currency, with your currency next to them.</p></div>${curSelect()}</div>
  <div class="pref"><div><b>Safe view</b><p>Blur explicit staff photos until tapped. Same switch as on the Staff page, venue pages and the photo gallery.</p></div><input type="checkbox" class="switch" data-safe-toggle ${getSafe() ? 'checked' : ''}></div>
  <div class="pref"><div><b>Show only LGBTQ+ friendly venues</b><p>Applies to search, map and deals.</p></div><input type="checkbox" class="switch"></div>
  <div class="pref"><div><b>Private profile</b><p>Your reviews show as “AJ***”.</p></div><input type="checkbox" class="switch" checked></div>
  <div class="pref"><div><b>Download my data</b><p>Your account, lists, notes, check-ins, reviews and messages as a file (JSON).</p></div><button class="btn btn-ghost btn-sm" data-export>Download</button></div>
  <div class="pref"><div><b>Delete my account</b><p>Deletes your account, lists, check-ins, alerts and messages within 30 days. <a href="../privacy.html#delete" style="text-decoration:underline">How deletion works</a></p></div><button class="btn btn-ghost btn-sm" style="color:#ff7d8d" data-delacct>Delete</button></div>`;

/* preferences are real settings: home city = where fresh visits start; language + currency apply site-wide */
const summary = () => { const c = cityOf(getHome()); $('#me-sum').textContent = `Home city: ${c.name} · ${LANGS.find(l => l[0] === getLang())[2]} · ${getCur() === 'NONE' ? '฿ THB' : getCur()}`; };
summary();
document.addEventListener('change', e => {
  if (e.target.id === 'pref-home') { const c = cityOf(e.target.value); store.set('home', c.slug); setLoc({ country: c.country, city: c.slug }); summary(); { const t = document.getElementById('toast') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'toast', className: 'toast' })); t.textContent = `Home city set to ${c.name}`; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); } }
  if (e.target.id === 'pref-lang') { store.set('lang', e.target.value); location.reload(); }
});
/* PDPA: data download + account deletion */
document.addEventListener('click', e => {
  if (e.target.closest('[data-export]')) {
    const data = { exported: new Date().toISOString(), account: { name: 'Alexander J.', home_city: getHome(), language: getLang(), currency: getCur(), safe_view: getSafe() }, lists: memberLists(), checkins: checkins() };
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })), download: 'swanpass-my-data.json' }); a.click();
  }
  if (e.target.closest('[data-delacct]')) {
    const m = openModal('del', `<div class="modal-head"><h3 style="flex:1">Delete your account?</h3><button class="icon-btn" data-close aria-label="Close">${icon('close')}</button></div>
      <div class="modal-body"><p style="margin-top:0">This deletes your account, lists and notes, check-ins and badges, alerts and messages. It can’t be undone after 30 days.</p>
      <label class="fcheck" style="padding:8px 0"><input type="checkbox" id="del-keep"> Keep my reviews, shown as “Deleted user”</label>
      <p class="muted" style="font-size:13px">Want a copy first? <a href="#" data-export style="text-decoration:underline">Download my data</a></p>
      <label style="display:block;font-size:13px;font-weight:600;margin:12px 0 6px">Type DELETE to confirm</label><input class="input" id="del-confirm" style="width:100%" autocomplete="off"></div>
      <div class="sheet-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-red" style="flex:1" id="del-go" disabled>Delete my account</button></div>`);
    $('#del-confirm', m).oninput = ev => { $('#del-go', m).disabled = ev.target.value.trim() !== 'DELETE'; };
    $('#del-go', m).onclick = () => { m.innerHTML = `<div class="modal-body" style="text-align:center;padding:30px"><div style="font-size:40px">✓</div><h3>Account scheduled for deletion</h3><p class="muted">You’ve been logged out. We’ll email you when it’s done. Changed your mind? Log in within 30 days to cancel.</p><button class="btn btn-ghost" data-close>Close</button></div>`; };
  }
});
function show() { const k = (location.hash || '#overview').slice(1); $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + k)); $$('[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === k)); }
window.addEventListener('hashchange', show); show();
$('#p-overview').insertAdjacentHTML('afterbegin', `<div style="float:right">${note('Members area: Airbnb-style lists (private notes, share link), self-reported check-ins with levels and badges (no fake “money saved” — we can’t know visits), alerts by email/LINE. Demo member data; venue details are real.')}</div>`);
</script>
</body>
</html>
