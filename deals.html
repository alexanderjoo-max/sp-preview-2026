<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deals — SwanPass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sp.css">
<style>
  .deal-hero { padding: 26px 0 22px; background: radial-gradient(700px 260px at 10% 0%, rgba(34, 197, 94, .16), transparent), radial-gradient(600px 260px at 95% 0%, rgba(232, 20, 42, .16), transparent); border-bottom: 1px solid var(--line); }
  .dh-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .dh-stats { display: flex; gap: 8px; }
  .dh-stat { padding: 10px 14px; border-radius: 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); min-width: 104px; }
  .dh-stat b { display: block; font-size: 20px; font-weight: 900; color: var(--deal); line-height: 1.1; white-space: nowrap; }
  .dh-stat span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .redeem { margin-top: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 14px; border: 1px dashed rgba(34, 197, 94, .5); background: linear-gradient(90deg, rgba(34, 197, 94, .14), rgba(34, 197, 94, .03)); }
  .redeem .lbl { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--deal); }
  .redeem .opt { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--deal); color: #06210f; font-weight: 800; font-size: 14.5px; }
  .redeem .opt.alt { background: rgba(255, 255, 255, .08); color: var(--text); border: 1px solid var(--line-2); }
  .redeem .or { color: var(--muted); font-size: 13px; }
  .redeem .fine { margin-left: auto; color: var(--text-2); font-size: 13px; }
  @media (max-width: 720px) {
    .deal-hero { padding: 18px 0 16px; }
    .dh-top { gap: 12px; }
    .dh-stats { width: 100%; gap: 6px; }
    .dh-stat { flex: 1; min-width: 0; padding: 8px 10px; }
    .dh-stat b { font-size: 15px; }
    .dh-stat span { font-size: 9.5px; }
    .redeem { margin-top: 12px; padding: 10px 12px; gap: 6px 8px; }
    .redeem .lbl { width: 100%; font-size: 11px; }
    .redeem .opt { font-size: 13px; padding: 6px 11px; }
    .redeem .fine { margin-left: 0; width: 100%; font-size: 12px; }
  }
  .dealcard .card-deal { font-size: 14.5px; padding: 10px 12px; margin: 8px -3px 0; border-radius: 10px; background: var(--deal-bg); border: 1px dashed rgba(95, 240, 181, .35); }
</style>
</head>
<body>
<main>
  <section class="deal-hero"><div class="wrap">
    <div class="dh-top">
      <div>
        <div class="eyebrow" style="color:var(--deal)">● Live deals</div>
        <h1 class="display" style="font-size:clamp(32px,4.5vw,52px);margin-top:6px">Deals in <em id="dh-city">Bangkok</em></h1>
      </div>
      <div class="dh-stats">
        <div class="dh-stat"><b class="num" id="dh-n">24</b><span>Active deals</span></div>
        <div class="dh-stat"><b>Free jacuzzi</b><span>Top deal</span></div>
        <div class="dh-stat"><b class="num">฿800</b><span>Max savings</span></div>
      </div>
    </div>
    <div class="redeem">
      <span class="lbl">✨ How to redeem</span>
      <span class="opt">🗣️ Say “SwanPass”</span><span class="or">or</span><span class="opt alt">📱 Show this screen</span>
      <span class="fine">No codes, no printouts, no sign-up.</span>
    </div>
  </div></section>
  <div id="app"></div>
</main>
<script src="assets/data.js"></script>
<script src="assets/sp.js"></script>
<script>
  shell('deals');
  const setCity = () => { $('#dh-city').textContent = locLabel(); const loc = getLoc(); $('#dh-n').textContent = LISTINGS.filter(l => l.deal && (!loc.country || l.country === loc.country) && (!loc.city || l.city === loc.city)).length; };
  setCity(); document.addEventListener('sp:loc', setCity);
  directory({
    el: $('#app'),
    preset: { deal: true },
    title: S => `${S.city ? cityOf(S.city).name : S.country ? countryOf(S.country).name : 'All'} deals`,
    render: l => card(l).replace('class="card ', 'class="card dealcard '),
  });
  $('.filters').insertAdjacentHTML('afterbegin', `<div class="muted" style="font-size:12.5px;margin-bottom:12px">${note('ClickUp “Deals Page: Add Filters on left”. Same filter component as Explore with “Has deal” locked on — one component to maintain.')} Same filters as Explore.</div>`);
</script>
</body>
</html>
